# Temporary source-pinned hosted observation.
name: Observe the hosted public catalogue
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-public-catalogue
  cancel-in-progress: false
jobs:
  hosted:
    if: github.repository == 'alvarovillalbaa/ayudario' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: f9cee29ba5d2da884464d2cc440fa6c6a2b5bd2f
    steps:
      - name: Define owned runner paths
        shell: bash
        run: |
          printf 'AYUDARIO_PROOF_DIR=%s\n' "$RUNNER_TEMP/ayudario-hosted-proof" >> "$GITHUB_ENV"
          printf 'AYUDARIO_PLAYWRIGHT_DIR=%s\n' "$RUNNER_TEMP/ayudario-hosted-tools" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/ayudario-hosted-browser-binaries" >> "$GITHUB_ENV"
          printf 'npm_config_cache=%s\n' "$RUNNER_TEMP/ayudario-hosted-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Bind the exact preparation source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$AYUDARIO_PROOF_DIR"
          node scripts/fingerprint.mjs "$AYUDARIO_PROOF_DIR/source-before.json"
          node --check tests/e2e/hosted.mjs
      - name: Install exact disposable browser tools
        shell: bash
        run: |
          npm install --prefix "$AYUDARIO_PLAYWRIGHT_DIR" --ignore-scripts --omit=optional --no-audit --no-fund playwright@1.65.0
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile(`${process.env.AYUDARIO_PLAYWRIGHT_DIR}/package-lock.json`, 'utf8'));
          const expected = {
            playwright: 'sha512-F3AMWcR44qMBt4kq+6Kb6mX7bjGXshktKFOPULd7reED6ZJWevjbNRqysP7q+AATE9kdPEZBibex1BYsvpVoeA==',
            'playwright-core': 'sha512-vNSKgH6YqtN7cdT/L334zo0a+YwkrpicyrHJlWWPIm/Q+Nn2SWInil01oT0mbu96U4GgoRtCYQD9CzJQgju+lA=='
          };
          for (const [name, integrity] of Object.entries(expected)) {
            const entry = lock.packages[`node_modules/${name}`];
            if (entry?.version !== '1.65.0' || entry.integrity !== integrity) throw new Error(`Browser package identity mismatch: ${name}`);
          }
          JS
          "$AYUDARIO_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: One hosted B05 observation without a local server
        shell: bash
        run: node tests/e2e/hosted.mjs
      - name: Always verify unchanged preparation source
        if: always()
        shell: bash
        run: |
          test -f "$AYUDARIO_PROOF_DIR/source-before.json"
          node scripts/fingerprint.mjs "$AYUDARIO_PROOF_DIR/source-after.json"
          cmp "$AYUDARIO_PROOF_DIR/source-before.json" "$AYUDARIO_PROOF_DIR/source-after.json"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Retain bounded original proof in readable logs
        if: always()
        shell: bash
        run: node scripts/emit-proof.mjs
      - name: Retain the original hosted observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-public-catalogue
          path: ${{ runner.temp }}/ayudario-hosted-proof
          retention-days: 7
