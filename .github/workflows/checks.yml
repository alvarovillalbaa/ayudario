name: Focused application checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '!public/data/calls.json'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'public/**'
      - '!public/data/calls.json'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Define owned proof path
        shell: bash
        run: echo "AYUDARIO_PROOF_DIR=$RUNNER_TEMP/ayudario-preparation-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Current edition regression and owned teardown
        run: python3 tests/scripts/regression-v2-qa.py
      - name: Retain original bytes in job log
        if: always()
        run: node tests/scripts/emit-preparation-proof.mjs
      - name: Retain original bounded proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-application-checks
          path: ${{ env.AYUDARIO_PROOF_DIR }}
          retention-days: 7
